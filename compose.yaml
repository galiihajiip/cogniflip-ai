# Local development database only. Bound to 127.0.0.1; the credentials below
# are throwaway local values, not production secrets. See db/README.md.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: cogniflip
      POSTGRES_PASSWORD: cogniflip_local_only
      POSTGRES_DB: cogniflip
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - cogniflip-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cogniflip -d cogniflip"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  cogniflip-pgdata:
