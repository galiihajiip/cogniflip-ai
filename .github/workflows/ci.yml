name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Baseline checks need no secrets; none are configured here.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  database-integration:
    name: Database integration (PostgreSQL 18.6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        # Throwaway CI-only credentials for an ephemeral container; not secrets.
        env:
          POSTGRES_USER: cogniflip
          POSTGRES_PASSWORD: cogniflip_ci_only
          POSTGRES_DB: cogniflip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cogniflip -d cogniflip"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://cogniflip:cogniflip_ci_only@localhost:5432/cogniflip
      DATABASE_URL: postgresql://cogniflip:cogniflip_ci_only@localhost:5432/cogniflip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: npm run db:migrate
      - run: npm run db:status
